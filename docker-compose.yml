version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: deptdash-db
    environment:
      POSTGRES_USER: deptdash
      POSTGRES_PASSWORD: deptdash
      POSTGRES_DB: deptdash
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
